name: Push OCI

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: docker
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup Flux CLI
        run: |
          FLUX_VERSION="2.9.3"
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          FLUX_DIR="$HOME/.local/bin"
          mkdir -p "$FLUX_DIR"
          wget -qO- "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_${ARCH}.tar.gz" \
            | tar xz -C "$FLUX_DIR" flux
          chmod +x "$FLUX_DIR/flux"
          echo "$FLUX_DIR" >> "$GITHUB_PATH"

      - name: Push artefact to registry
        run: |
          STAGE="$HOME/artifact"
          mkdir -p "$STAGE"
          cp -a "$GITHUB_WORKSPACE/." "$STAGE/"
          flux push artifact \
            oci://glk-registry.local.gardener.cloud:6001/landscape:${{ github.ref_name }} \
            --insecure-registry \
            --path="$STAGE" \
            --source="$(git config --get remote.origin.url)" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}"
