apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-monitoring
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: {{ .landscapeComponentPath }}
  prune: true
  dependsOn:
  - name: garden
    namespace: garden
  interval: 30m
  timeout: 5m
  retryInterval: 30s
  wait: true
#  healthCheckExprs:
#  - apiVersion: core.gardener.cloud/v1beta1
#    kind: Project
#    current: "status.phase == 'Ready'"
