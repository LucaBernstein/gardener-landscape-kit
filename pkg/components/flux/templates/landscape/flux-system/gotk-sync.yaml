{{- if eq .sourceKind "GitRepository" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  recurseSubmodules: true # required if Git submodules are used, e.g. to include the base repo in the landscape repo.
  ref:
    {{ .source_ref }}
  secretRef:
    name: flux-system
  url: {{ .source_url }}
{{- else if eq .sourceKind "OCIRepository" }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m0s
  provider: generic
  ref:
    {{ .source_ref }}
  secretRef:
    name: flux-system
  url: {{ .source_url }}
{{- end }}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./{{ .flux_path }}
  prune: false
  sourceRef:
    kind: {{ .sourceKind }}
    name: flux-system
