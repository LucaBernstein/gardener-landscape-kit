services:
  git:
    container_name: forgejo-glk
    build: .
    ports:
      - "5123:3000"
    volumes:
      - ./forgejo.conf:/app.ini.sample:ro
      - ./data:/data
    networks:
      kind:
        aliases:
          - git.local.gardener.cloud

networks:
  kind:
    external: true
    name: kind
